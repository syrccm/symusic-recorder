name: scheduled

# 예약 녹음 — 현재 비활성. 아래 schedule 블록의 주석을 풀고 실제 시간을 채우면 켜진다.
#
# cron 은 UTC 기준이다. KST = UTC + 9시간 → "KST 시각 − 9시간" 으로 적는다.
#   - KST 09:00 이후  : 같은 요일          (예: 주일 11:00 KST → 일 02:00 UTC → '0 2 * * 0')
#   - KST 09:00 이전  : 하루 전 요일로 넘어감 (예: 주일 07:30 KST → 토 22:30 UTC → '30 22 * * 6')
#   - 요일: 0=일 1=월 2=화 3=수 4=목 5=금 6=토
# GitHub 예약 실행은 5~15분 늦게 시작되는 일이 흔하므로 예배 시작보다 10~15분 앞당겨 잡는다.
# 아래 시간은 전부 자리 표시(예시)이며 실제 예배 시간이 아니다.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "50 22 * * 6" # 주일 1부   — KST 일 07:50 (예시)
  #   - cron: "50 0 * * 0"  # 주일 2부   — KST 일 09:50 (예시)
  #   - cron: "50 2 * * 0"  # 주일 3부   — KST 일 11:50 (예시)
  #   - cron: "50 11 * * 5" # 금요철야   — KST 금 20:50 (예시)

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: record.yml 실행
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 위 cron 문자열과 똑같이 맞춰 제목·최대 시간을 정한다.
          case "$SCHEDULE" in
            # "50 22 * * 6") TITLE="주일 1부 예배"; MAX=90 ;;
            # "50 0 * * 0")  TITLE="주일 2부 예배"; MAX=90 ;;
            # "50 2 * * 0")  TITLE="주일 3부 예배"; MAX=90 ;;
            # "50 11 * * 5") TITLE="금요철야";      MAX=180 ;;
            *) TITLE="예약 녹음"; MAX="" ;;
          esac
          SESSION_ID="sched-$(TZ=Asia/Seoul date +%Y%m%d-%H%M)"
          # live_url 은 비워 둔다 → 리포 변수 LIVE_URL 사용
          gh workflow run record.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f session_id="$SESSION_ID" \
            -f title="$TITLE" \
            -f max_minutes="$MAX"
          echo "record.yml 실행 요청: $SESSION_ID ($TITLE)"
