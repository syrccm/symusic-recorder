name: dispatcher

# 예약 발사기 — 10분마다 R2 의 reservations.json 을 읽어 때가 된 예약의 녹음(record.yml)을 띄우고,
# 채널의 예정·진행 중 라이브 목록(upcoming.json)을 갱신한다. 로직은 scripts/dispatch.sh.
#
# - cron 은 UTC 기준이고 GitHub 사정으로 수 분~수십 분 늦게 돌 수 있다. 예약의 lead_minutes 가 이 지연을 흡수한다.
# - 정각(0분)은 GitHub 전체가 붐벼 지연이 크므로 7분부터 10분 간격으로 돈다.
# - 공개 리포는 60일간 커밋이 없으면 schedule 이 자동으로 꺼진다 → 마지막 커밋이 50일을 넘기면 빈 커밋을 올린다.

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "모의 실행 — 녹음을 띄우지 않고 R2 에 쓰지 않는다(판정 결과만 로그로)"
        required: false
        type: boolean
        default: false

permissions:
  actions: write # record.yml 실행, 실행 목록 조회
  contents: write # 60일 비활성화 방지용 빈 커밋

# 발사기끼리 겹쳐 돌지 않게 한다(같은 예약을 두 번 띄우는 일 방지).
concurrency:
  group: dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: yt-dlp 설치
        run: |
          pipx install --quiet "yt-dlp[default]"
          yt-dlp --version

      - name: 예약 확인 · 녹음 실행
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LIVE_URL: ${{ vars.LIVE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/dispatch.sh

      - name: 60일 비활성화 방지(50일 넘으면 빈 커밋)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          LAST="$(git log -1 --format=%ct)"
          DAYS=$(( ($(date +%s) - LAST) / 86400 ))
          echo "마지막 커밋 후 ${DAYS}일"
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: 예약 워크플로 유지(60일 비활성화 방지)"
            git push
          fi
